<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>OpenNOW Chrome</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="container">

        <div class="header">
            <h1>🎮 OpenNOW</h1>
            <p>Cliente para GeForce NOW</p>
        </div>

        <div class="search">
            <input
                type="text"
                id="search"
                placeholder="Buscar juego...">
        </div>

        <div id="library" class="library">

            <div class="game">
                Fortnite
            </div>

            <div class="game">
                Cyberpunk 2077
            </div>

            <div class="game">
                Counter-Strike 2
            </div>

            <div class="game">
                Genshin Impact
            </div>

        </div>

        <button id="launch">
            Iniciar GeForce NOW
        </button>

    </div>

<script src="popup.js"></script>

</body>
</html>
